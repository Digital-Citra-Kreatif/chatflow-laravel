name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}${{ matrix.sunrice && ' + Sunrice panel' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package alone supports PHP 8.3; the Sunrice panel (a dev dependency) needs 8.4.
          - php: '8.3'
            sunrice: false
          - php: '8.4'
            sunrice: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, openssl, sqlite3, pdo_sqlite
          coverage: none

      - name: Leave the Sunrice panel out
        if: ${{ !matrix.sunrice }}
        run: composer remove --dev sunrice/admin --no-update --no-interaction

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=never ${{ !matrix.sunrice && '--testsuite ChatFlow' || '' }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm packages
        run: npm ci --no-audit --no-fund && npm --prefix sunrice ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck && npm --prefix sunrice run typecheck

      - name: Vitest
        run: npm test && npm --prefix sunrice test

      - name: Build
        run: npm run build && npm run build:sunrice

      # dist/ is committed: what is there must be what the sources build.
      - name: dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
              git status --short -- dist
              echo "::error::dist/ differs from a fresh build: run npm run build and npm run build:sunrice, and commit dist/."
              exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, openssl, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm packages
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
