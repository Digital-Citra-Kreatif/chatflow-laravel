# Serves the package in a throwaway Laravel app for the browser tests: the standalone
# admin at /chatflow/admin and a Sunrice panel with the ChatFlow plugin at /admin.
#   vendor/bin/testbench workbench:build && vendor/bin/testbench serve --port=8000
providers:
  - Inertia\ServiceProvider
  - Spatie\Permission\PermissionServiceProvider
  - Laravel\Mcp\Server\McpServiceProvider
  - Sunrice\Admin\AdminServiceProvider
  - ChatFlow\Laravel\ChatFlowServiceProvider
  - Workbench\App\Providers\AdminPanelProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations: true

env:
  - APP_KEY="base64:Q2hhdEZsb3dXb3JrYmVuY2hLZXlGb3JUZXN0c09ubHk="
  - APP_ENV=local
  - DB_CONNECTION=sqlite
  - QUEUE_CONNECTION=sync
  - MAIL_MAILER=log
  - LOG_CHANNEL=single
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  - AUTH_MODEL=Workbench\App\Models\User

workbench:
  start: /admin/chatflow/forms
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - asset-publish
  assets:
    - chatflow-assets
    - sunrice-admin-assets
  sync: []
